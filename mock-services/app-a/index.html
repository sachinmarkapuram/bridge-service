<!DOCTYPE html>
<html>
<head>
    <title>Mock Application A</title>
</head>
<body>
    <h1>Mock Application A</h1>
    <p>This is a mock service for testing the bridge service.</p>
    <script>
        // Simple API endpoint simulation
        if (window.location.pathname === '/api/data') {
            document.body.innerHTML = JSON.stringify({
                "service": "application-a",
                "status": "healthy",
                "timestamp": new Date().toISOString(),
                "data": {
                    "message": "Hello from Application A",
                    "version": "1.0.0"
                }
            });
            document.body.style.fontFamily = 'monospace';
        }
    </script>
</body>
</html>
